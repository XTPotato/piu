# What pygbag packages into the WASM bundle.
#
# Paths are matched against folders rooted at the project directory, so they
# need a leading slash - the same form as pygbag's own built-in ignore list
# (/.git, /.github, /dist, /build ...).
#
# .venv is NOT in that built-in list: pygbag ships "/venv" but not "/.venv",
# and its folder paths start with "/" so the "hidden folder" check never
# fires either. Without this file the entire virtualenv - pygame's bundled
# example assets included - gets packed into the bundle.
[DEPENDENCIES]
ignoreDirs = ["/.venv", "/tests", "/tools", "/.pytest_cache", "/.claude"]
ignoreFiles = ["requirements.lock", "pygbag.ini", "pyproject.toml", "uv.lock",
               "logs_89502610876.zip"]
